[package]
name = "rendernorth-industrial"
version = "0.1.0"
description = "RenderNorth Industrial — EVE Online industrial command center (intelligence, not automation)"
edition = "2021"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
chrono = { version = "0.4", features = ["serde"] }
csv = "1"

[profile.release]
codegen-units = 1
lto = true
strip = true
